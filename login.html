<style>

    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body{
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .login-box{
        width: 100%;
        max-width: 400px;
        background: white;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .login-box h1{
        text-align: center;
        margin-bottom: 10px;
        color: #333;
    }

    .login-box p{
        text-align: center;
        color: #777;
        margin-bottom: 30px;
    }

    label{
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #333;
    }

    input{
        width: 100%;
        padding: 13px;
        border: 1px solid #ddd;
        border-radius: 8px;
        outline: none;
        font-size: 15px;
        margin-bottom: 20px;
        transition: 0.3s;
    }

    input:focus{
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
    }

    button{
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 8px;
        background: #667eea;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover{
        background: #764ba2;
        transform: translateY(-2px);
    }

    @media(max-width: 450px){

        .login-box{
            margin: 20px;
            padding: 30px 20px;
        }

    }

</style>
